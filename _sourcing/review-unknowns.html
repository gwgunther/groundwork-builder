<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spike — Review Unknown Sites</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #151820;
    --panel-2: #1c2029;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8a94a6;
    --accent: #6aa6ff;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px; font: inherit; cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 53px); }
  #list { overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); }
  .item {
    padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: 11px; }
  .item .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 22px; font-size: 12px; padding-top: 2px; }
  .item .name { font-weight: 500; }
  .item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item .tag {
    display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px;
    background: #262b36; color: var(--muted); margin-right: 4px; margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
  }
  .item .tag.mill { background: #3b1f1f; color: var(--bad); }
  .item .tag.chain { background: #2d2a1b; color: var(--warn); }
  .item .tag.wp { background: #1d2d2a; color: #6cd9c4; }
  .item .tag.diy { background: #2a1d2d; color: #c47fd9; }
  .item .tag.modern { background: #1f2d3b; color: var(--accent); }
  .item .tag.dead { background: #1a1a1a; color: #555; }
  .item .tag.skip { background: #1a1a1a; color: #555; }

  #detail { display: flex; flex-direction: column; min-width: 0; }
  #detail .meta-bar {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    background: var(--panel);
  }
  #detail .meta-bar h2 { margin: 0; font-size: 16px; font-weight: 600; }
  #detail .meta-bar .stats { color: var(--muted); font-size: 13px; }
  #detail .meta-bar a {
    color: var(--accent); text-decoration: none; font-size: 13px;
    border: 1px solid var(--border); padding: 5px 10px; border-radius: 5px;
  }
  #detail .meta-bar a:hover { border-color: var(--accent); }
  #classifiers {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel-2); display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center;
  }
  #classifiers .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
  #classifiers button {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 6px 11px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer;
  }
  #classifiers button:hover { border-color: var(--accent); }
  #classifiers button.active { background: var(--accent); color: #0b0f17; border-color: var(--accent); font-weight: 600; }
  #classifiers textarea {
    flex: 1; min-width: 200px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; font: inherit;
    resize: vertical; min-height: 28px;
  }
  #frame-wrap { flex: 1; position: relative; background: #fff; }
  #frame { width: 100%; height: 100%; border: 0; }
  #frame-fallback {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: var(--panel); color: var(--muted); text-align: center; padding: 40px;
  }
  #frame-fallback.show { display: flex; }
  #frame-fallback a { color: var(--accent); }
  #progress { color: var(--muted); font-size: 12px; }
  kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 5px; font-size: 11px; font-family: "SF Mono", ui-monospace, monospace; color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Spike Review — 26 Unknown-Vendor Sites</h1>
  <span class="meta">Riverside–San Bernardino MSA · Classify each → improves detector</span>
  <span class="spacer"></span>
  <span id="progress">0 / 26 classified</span>
  <button id="export-btn">Export JSON</button>
  <button id="copy-btn">Copy JSON</button>
  <button id="reset-btn">Reset</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail">
    <div class="meta-bar">
      <h2 id="d-name">—</h2>
      <span class="stats" id="d-stats">—</span>
      <a id="d-link" target="_blank" rel="noopener">Open in new tab ↗</a>
    </div>
    <div id="classifiers">
      <span class="label">Classify:</span>
      <button data-cls="dental-mill">Dental Mill</button>
      <button data-cls="chain-dso">Chain / DSO</button>
      <button data-cls="wordpress-custom">WP Custom</button>
      <button data-cls="modern-custom">Modern Custom</button>
      <button data-cls="diy-builder">DIY (Wix/SQS)</button>
      <button data-cls="dead-or-bad">Dead / Bad</button>
      <button data-cls="skip">Skip</button>
      <textarea id="note" placeholder="Notes (optional): visible vendor name, theme, why you chose this..."></textarea>
    </div>
    <div id="frame-wrap">
      <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
      <div id="frame-fallback">
        <div>This site blocks embedding (X-Frame-Options / CSP).</div>
        <a id="fb-link" target="_blank" rel="noopener">Open it in a new tab →</a>
        <div style="font-size:12px">Then come back and classify. Use <kbd>J</kbd>/<kbd>K</kbd> or arrow keys to navigate.</div>
      </div>
    </div>
  </div>
</main>

<script>
const SITES = [{"practice":"Riverside Plaza Dentistry","city":"Riverside","rating":4.8,"reviews":840,"website":"https://www.riversideplazadentistry.com/?sc_cid=GBP%3AO%3AGP%3A442%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MzU1Nzg0NS03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D","finalUrl":"https://www.riversideplazadentistry.com/?sc_cid=GBP%3AO%3AGP%3A442%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MzU1Nzg0NS03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D"},{"practice":"Riverside Modern Dentistry","city":"Riverside","rating":5,"reviews":1439,"website":"https://www.riversidemoderndentistry.com/?sc_cid=GBP%3AO%3AGP%3A300%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MzQ3OTcxOTItNzE1LWxvY2F0aW9uLndlYnNpdGU%3D","finalUrl":"https://www.riversidemoderndentistry.com/?sc_cid=GBP%3AO%3AGP%3A300%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MzQ3OTcxOTItNzE1LWxvY2F0aW9uLndlYnNpdGU%3D"},{"practice":"Mission Grove Dentistry","city":"Riverside","rating":4.9,"reviews":484,"website":"https://www.missiongrovedentist.com/","finalUrl":"https://www.missiongrovedentist.com/"},{"practice":"Riverside Dentist - Dr. Morsy Dental Services","city":"Riverside","rating":4.8,"reviews":250,"website":"https://drmorsydental.com/","finalUrl":"https://drmorsydental.com/"},{"practice":"Smile Builder Dental","city":"Riverside","rating":4.9,"reviews":389,"website":"https://www.smilebuilderdental.com/","finalUrl":"https://www.smilebuilderdental.com/"},{"practice":"Arlington Dental Group and Orthodontics","city":"Riverside","rating":4.5,"reviews":338,"website":"https://www.arlingtondentalgroup.com/?sc_cid=GBP%3AO%3AGP%3A52%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MTEwMjY2MS03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D","finalUrl":"https://www.arlingtondentalgroup.com/?sc_cid=GBP%3AO%3AGP%3A52%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MTEwMjY2MS03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D"},{"practice":"Riverside West Dental Group","city":"Riverside","rating":4.5,"reviews":64,"website":"https://txt.care/jgLL6Dm","finalUrl":"https://onlinebooking.mydentistlink.com/e6b5d9dc-63d1-4d41-a1f3-9de225c71675/f93d6e15-8d6c-407d-bd52-ce909da52661"},{"practice":"Canyon Springs Dental Group and Orthodontics","city":"Riverside","rating":4.5,"reviews":337,"website":"https://www.canyonspringsdental.com/?sc_cid=GBP%3AO%3AGP%3A48%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MTEwMjY1OC03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D","finalUrl":"https://www.canyonspringsdental.com/?sc_cid=GBP%3AO%3AGP%3A48%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MTEwMjY1OC03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D"},{"practice":"University Dental Clinic","city":"Riverside","rating":5,"reviews":93,"website":"https://universitydentalclinicriverside.com/","finalUrl":"https://universitydentalclinicriverside.com/"},{"practice":"Dental Practice of San Bernardino","city":"San Bernardino","rating":4.3,"reviews":60,"website":"https://www.sanbernardinofamilydental.com/","finalUrl":"https://www.sanbernardinofamilydental.com/"},{"practice":"Vernon Dental Specialty Group","city":"San Bernardino","rating":4.6,"reviews":1512,"website":"https://vdspecialties.com/","finalUrl":"https://vdspecialties.com/"},{"practice":"Gill Family Dentistry","city":"San Bernardino","rating":4.7,"reviews":1376,"website":"https://drgillfamilydentistry.com/","finalUrl":"https://drgillfamilydentistry.com/"},{"practice":"D Street Family Dentistry","city":"San Bernardino","rating":4.9,"reviews":206,"website":"http://sanbernardinoleedds.com/","finalUrl":"https://www.sanbernardinoleedds.com/"},{"practice":"Dental Lounge","city":"San Bernardino","rating":5,"reviews":129,"website":"https://www.sbdentallounge.com/","finalUrl":"https://www.sbdentallounge.com/"},{"practice":"Inland Dental Arts","city":"San Bernardino","rating":4.9,"reviews":131,"website":"https://www.inlanddentalarts.com/","finalUrl":"https://www.inlanddentalarts.com/"},{"practice":"Hospitality Dental & Orthodontics","city":"San Bernardino","rating":4.8,"reviews":529,"website":"https://www.hospitalitydental.com/","finalUrl":"https://www.hospitalitydental.com/"},{"practice":"Inland Dental Center","city":"San Bernardino","rating":4.3,"reviews":90,"website":"https://www.idcsanbernardino.com/","finalUrl":"https://www.idcsanbernardino.com/"},{"practice":"Hub Plaza Dental Group and Orthodontics","city":"San Bernardino","rating":4.7,"reviews":308,"website":"https://www.hubplazadental.com/?sc_cid=GBP%3AO%3AGP%3A20%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MTEwMjYzMi03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D","finalUrl":"https://www.hubplazadental.com/?sc_cid=GBP%3AO%3AGP%3A20%3AOrganic_Search%3AGeneral%3Ana&_vsrefdom=organic_gbp&y_source=1_MTEwMjYzMi03MTUtbG9jYXRpb24ud2Vic2l0ZQ%3D%3D"},{"practice":"Southland Dental Group: Antoine Sourialle, DDS, Inc","city":"San Bernardino","rating":4.8,"reviews":348,"website":"https://www.stbernardinedentalcenter.com/","finalUrl":"https://www.stbernardinedentalcenter.com/"},{"practice":"Children Dental World","city":"San Bernardino","rating":4.9,"reviews":1579,"website":"https://www.mychildrendentalworld.com/","finalUrl":"https://www.mychildrendentalworld.com/"},{"practice":"Cal Select Dental Group","city":"San Bernardino","rating":4.6,"reviews":194,"website":"http://www.calselectdental.com/","finalUrl":"https://www.calselectdental.com/"},{"practice":"Children Dental World","city":"San Bernardino","rating":4.8,"reviews":1427,"website":"http://mychildrendentalworld.com/","finalUrl":"https://www.mychildrendentalworld.com/"},{"practice":"MGO Dental","city":"San Bernardino","rating":4.3,"reviews":47,"website":"http://www.mgodental.com/","finalUrl":"https://www.mgodental.com/"},{"practice":"Mazen Atout, DMD","city":"San Bernardino","rating":5,"reviews":10,"website":"https://instagram.com/dr.mazenatout","finalUrl":"https://www.instagram.com/dr.mazenatout"},{"practice":"Lil Smile Builders Children's Dentistry","city":"San Bernardino","rating":4.8,"reviews":673,"website":"http://www.lilsmilebuilders.com/","finalUrl":"https://www.lilsmilebuilders.com/"},{"practice":"Arrowhead Dental Specialities","city":"San Bernardino","rating":3.9,"reviews":17,"website":"https://www.arrowheaddentalspecialties.org/contact-us/contact-information-office-map/","finalUrl":"https://www.arrowheaddentalspecialties.org/contact-us/contact-information-office-map/"}];
const STORAGE_KEY = 'spike-unknown-classifications-v1';

const state = {
  index: 0,
  classifications: loadState(),
};

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.classifications));
  renderProgress();
  renderList();
}

const $list = document.getElementById('list');
const $name = document.getElementById('d-name');
const $stats = document.getElementById('d-stats');
const $link = document.getElementById('d-link');
const $frame = document.getElementById('frame');
const $fallback = document.getElementById('frame-fallback');
const $fbLink = document.getElementById('fb-link');
const $note = document.getElementById('note');
const $progress = document.getElementById('progress');

function clsTag(c) {
  const map = {
    'dental-mill': 'mill', 'chain-dso': 'chain', 'wordpress-custom': 'wp',
    'modern-custom': 'modern', 'diy-builder': 'diy', 'dead-or-bad': 'dead', 'skip': 'skip',
  };
  return map[c] || '';
}

function renderList() {
  $list.innerHTML = '';
  SITES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'item' + (i === state.index ? ' active' : '');
    const c = state.classifications[s.website];
    div.innerHTML = `
      <div class="num">${i + 1}</div>
      <div style="min-width:0;flex:1">
        <div class="name">${escapeHtml(s.practice)}</div>
        <div class="sub">${escapeHtml(s.city)} · ${s.rating ?? '—'}★ · ${s.reviews ?? 0} reviews</div>
        ${c ? `<span class="tag ${clsTag(c.label)}">${c.label}</span>` : ''}
      </div>
    `;
    div.addEventListener('click', () => { state.index = i; render(); });
    $list.appendChild(div);
  });
}

function render() {
  renderList();
  const s = SITES[state.index];
  if (!s) return;
  $name.textContent = s.practice;
  $stats.textContent = `${s.city} · ${s.rating ?? '—'}★ · ${s.reviews ?? 0} reviews`;
  $link.href = s.website;
  $fbLink.href = s.website;
  $fallback.classList.remove('show');

  // Try to load iframe; if it fails (X-Frame-Options/CSP), show fallback.
  $frame.style.display = '';
  $frame.src = s.website;
  let loaded = false;
  const onLoad = () => { loaded = true; };
  $frame.addEventListener('load', onLoad, { once: true });
  setTimeout(() => {
    if (!loaded) {
      $frame.style.display = 'none';
      $fallback.classList.add('show');
    }
  }, 4000);

  // Active classifier button + note
  const existing = state.classifications[s.website];
  document.querySelectorAll('#classifiers button').forEach(b => {
    b.classList.toggle('active', existing && existing.label === b.dataset.cls);
  });
  $note.value = existing?.note || '';
}

function renderProgress() {
  const count = Object.keys(state.classifications).length;
  $progress.textContent = `${count} / ${SITES.length} classified`;
}

document.querySelectorAll('#classifiers button').forEach(b => {
  b.addEventListener('click', () => {
    const s = SITES[state.index];
    state.classifications[s.website] = { label: b.dataset.cls, note: $note.value };
    saveState();
    // Auto-advance to next unclassified
    const next = SITES.findIndex((x, i) => i > state.index && !state.classifications[x.website]);
    if (next !== -1) state.index = next;
    else state.index = Math.min(state.index + 1, SITES.length - 1);
    render();
  });
});
$note.addEventListener('blur', () => {
  const s = SITES[state.index];
  const existing = state.classifications[s.website];
  if (existing) {
    existing.note = $note.value;
    saveState();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'j' || e.key === 'ArrowDown') {
    state.index = Math.min(state.index + 1, SITES.length - 1); render(); e.preventDefault();
  } else if (e.key === 'k' || e.key === 'ArrowUp') {
    state.index = Math.max(state.index - 1, 0); render(); e.preventDefault();
  }
});

document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state.classifications, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'unknown-classifications.json';
  a.click();
});
document.getElementById('copy-btn').addEventListener('click', async () => {
  await navigator.clipboard.writeText(JSON.stringify(state.classifications, null, 2));
  const b = document.getElementById('copy-btn');
  const old = b.textContent; b.textContent = 'Copied ✓';
  setTimeout(() => b.textContent = old, 1500);
});
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Clear all classifications?')) {
    state.classifications = {}; saveState();
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
renderProgress();
</script>
</body>
</html>
